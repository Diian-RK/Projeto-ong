<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos - ONG</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header>
        <h1>Projetos da ONG</h1>
        <button id="tema-toggle" type="button" aria-label="Ativar modo escuro">
    🌙 Modo escuro
</button>

        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <main>
        <section id="projetos">
            <h2>Nossos Projetos</h2>

            <p>
                Conheça as iniciativas desenvolvidas pela ONG
                para promover inclusão social e ajudar a comunidade.
            </p>

            <img src="../img/doacao.jpg"
     alt="Pessoa realizando uma doação para uma ação social">

<img src="../img/voluntarios.jpg"
     alt="Voluntários participando de uma ação social">
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ONG - Inclusão Social</p>
    </footer>

    <script>
    const botaoTema = document.querySelector('#tema-toggle');

    if (localStorage.getItem('modo-escuro') === 'ativo') {
        document.body.classList.add('modo-escuro');
    }

    botaoTema.addEventListener('click', function () {
        document.body.classList.toggle('modo-escuro');

        if (document.body.classList.contains('modo-escuro')) {
            localStorage.setItem('modo-escuro', 'ativo');
        } else {
            localStorage.removeItem('modo-escuro');
        }
    });
</script>

</body>
</html>
