<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ONG</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>Cadastro</h1>

        <button id="tema-toggle" type="button">
    🌙 Modo escuro
</button>

        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <main id="app">
    </main>

    <footer>
        <p>&copy; 2026 ONG - Inclusão Social</p>
    </footer>

    <script>
    const botaoTema = document.querySelector('#tema-toggle');

    if (localStorage.getItem('modo-escuro') === 'ativo') {
        document.body.classList.add('modo-escuro');
    }

    botaoTema.addEventListener('click', function () {
        document.body.classList.toggle('modo-escuro');

        if (document.body.classList.contains('modo-escuro')) {
            localStorage.setItem('modo-escuro', 'ativo');
        } else {
            localStorage.removeItem('modo-escuro');
        }
    });
</script>

    <script type="module" src="../js/app.js"></script>

</body>

</html>
